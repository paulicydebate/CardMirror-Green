name: Deploy CardMirror Green web app
on:
  push:
    branches: ['feature/full-card-api']
    paths: ['src/**', 'public/**', 'index.html', 'vite.config.ts', 'package*.json', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
concurrency:
  group: green-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/desktop ci
      - run: npm run typecheck
      - name: Check tablet and collaboration behavior
        run: npx vitest run tests/editor/ipad-workspace.test.ts tests/editor/mobile-layout.test.ts tests/collab/collab-gate.test.ts tests/collab/join-link.test.ts tests/collab/flow-coedit.test.ts
      - name: Build Green PWA for its own GitHub Pages path
        run: npm run build
        env:
          VITE_BASE: /CardMirror-Green/
      - name: Verify installable Green web build
        run: node scripts/verify-green-web.cjs
      - name: Install headless WebKit test runtime
        run: npx playwright install --with-deps webkit
      - name: Exercise tablet Flow, files, offline use and encrypted collaboration
        run: node scripts/test-ipad-web.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-ipad-webkit-checks
          path: tests/scratch/ipad-check
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

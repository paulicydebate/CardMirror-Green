name: Desktop builds (Windows and macOS)
on:
  workflow_dispatch:
  push:
    branches: ['feature/**']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            target: --win nsis --x64
          - os: macos-latest
            platform: macos
            arch: arm64
            target: --mac dmg zip --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/desktop ci
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm --prefix apps/desktop run build:native
      - run: npm --prefix apps/desktop run build:renderer
      - run: npm --prefix apps/desktop run build:main
      - run: npm --prefix apps/desktop run build:service
      - name: Package desktop app without publishing
        working-directory: apps/desktop
        run: npx --no-install electron-builder ${{ matrix.target }} --publish never
      - name: Verify packaged desktop resources and architecture
        run: node apps/desktop/scripts/verify-preview.cjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cardmirror-${{ matrix.platform }}-${{ matrix.arch }}-preview
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7

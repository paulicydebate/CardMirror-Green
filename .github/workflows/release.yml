name: Release desktop
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: green-desktop-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            target: --win nsis --x64
          - os: macos-latest
            platform: macos
            arch: arm64
            target: --mac dmg zip --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: npm ci
      - run: npm --prefix apps/desktop ci
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm --prefix apps/desktop run build:native
      - run: npm --prefix apps/desktop run build:renderer
      - run: npm --prefix apps/desktop run build:main
      - run: npm --prefix apps/desktop run build:service
      - name: Package with update metadata
        working-directory: apps/desktop
        run: npx --no-install electron-builder ${{ matrix.target }} --publish never
      - run: node apps/desktop/scripts/verify-preview.cjs ${{ matrix.arch }}
      - name: Verify Windows updater assets
        if: matrix.platform == 'windows'
        run: node apps/desktop/scripts/verify-windows-update.cjs
      - name: Verify Mac updater assets
        if: matrix.platform == 'macos'
        run: node apps/desktop/scripts/verify-mac-update.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cardmirror-green-${{ matrix.platform }}-release
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cardmirror-green-*-release
          merge-multiple: true
          path: release-assets
      - name: Publish both verified platforms together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          test -s release-assets/latest.yml
          test -s release-assets/latest-mac.yml
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --draft --title "CardMirror Green $TAG" --notes-file RELEASE_NOTES.md --verify-tag
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file RELEASE_NOTES.md

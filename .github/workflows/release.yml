name: Release Windows
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: green-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version must match' }
      - run: npm ci
      - run: npm --prefix apps/desktop ci
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm --prefix apps/desktop run build:native
      - run: npm --prefix apps/desktop run build:renderer
      - run: npm --prefix apps/desktop run build:main
      - run: npm --prefix apps/desktop run build:service
      - name: Package Windows with update metadata
        working-directory: apps/desktop
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - run: node apps/desktop/scripts/verify-preview.cjs x64
      - run: node apps/desktop/scripts/verify-windows-update.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cardmirror-green-windows-release
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
      - name: Publish verified Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "CardMirror Green $tag (Windows)" --notes-file WINDOWS_RELEASE_NOTES.md --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          } else {
            $draft = gh release view $tag --json isDraft --jq .isDraft
            if ($draft -ne 'true') { throw 'Refusing to replace a published release' }
          }
          $assets = @(Get-ChildItem apps/desktop/release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName)
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit $tag --draft=false --latest --notes-file WINDOWS_RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
